<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>화학 · 자발성과 반응 속도</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&family=Jua&display=swap">
<style>
[hidden]{display:none!important}
:root{--bg:#14182a;--panel:#1d2238f2;--line:#ffffff22;--ink:#eef0ff;--acc:#5affd0;--gold:#ffd23f;--bad:#ff6a7a}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',sans-serif}
button,select,input{font-family:inherit}
#stage{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#top{position:fixed;left:0;right:0;top:0;z-index:20;display:flex;gap:10px;align-items:center;padding:8px 12px;background:linear-gradient(#0b0e1cdd,transparent)}
#top button{padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:#262c48;color:#fff;font:15px Jua}#top span{font-size:14px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#card{position:fixed;z-index:15;right:12px;top:54px;bottom:12px;width:min(560px,46vw);display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:0 12px 40px #000a;overflow:hidden}
#card .hd{display:flex;justify-content:space-between;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);font-size:14px}#card .hd b{color:var(--gold);font:17px Jua}#card .hd span{opacity:.7;white-space:nowrap}
#card .bd{flex:1;overflow:auto;padding:12px 16px;position:relative;-webkit-overflow-scrolling:touch}
#card .bd.inking{touch-action:none}
#card .ft{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--line)}#card .ft:empty{display:none}
#card .ft button{flex:1;padding:12px;border-radius:12px;border:1px solid var(--line);background:#262c48;color:#fff;font:17px Jua}#card .ft button.pri{background:linear-gradient(#5affd0,#2ac8a0);color:#08241c;border:0}#card .ft button:disabled{opacity:.35}
.fig{position:relative;background:#fff;border-radius:10px;margin-bottom:10px}.fig img{display:block;width:100%;max-height:36vh;object-fit:contain;border-radius:10px}
.zb{position:absolute;right:6px;bottom:6px;padding:5px 10px;border-radius:8px;border:0;background:#1d2238dd;color:#fff;font-size:13px}
.st{font-size:16.5px;line-height:1.75;margin:0 0 10px;color:#aab2d0}.st.now{color:#fff;font-size:18px;background:#262c48;border:1px solid #5affd055;border-radius:12px;padding:10px 12px}
.st b,.q b,.why b,.fb b{color:var(--gold)}
.hint{font-size:13px;opacity:.6}
.q{font-size:18px;line-height:1.6}
.opts{display:grid;gap:8px;margin:8px 0}.opts button,.ox button{text-align:left;padding:12px 14px;border-radius:12px;border:1.5px solid #5a6aa8;background:#262c48;color:#fff;font-size:16px;line-height:1.45}
.opts button.ok,.ox button.ok{background:#1f5a48;border-color:var(--acc)}.opts button.no,.ox button.no{background:#5a1f2a;border-color:var(--bad)}
.fb{border-radius:10px;padding:8px 12px;font-size:15.5px;line-height:1.6}.fb:empty{display:none}.fb.ok{background:#1f4a3a}.fb.no{background:#4a1f2a}.fb span{opacity:.9}
.bg{border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin:8px 0}.bg p{margin:2px 0 8px;font-size:16.5px;line-height:1.6}.ox{display:flex;gap:8px}.ox button{flex:1;text-align:center}
.why{font-size:15px;line-height:1.6;color:#d8def8;margin-top:6px}.why:empty{display:none}
.gs{border-left:3px solid var(--acc);padding:4px 0 4px 10px;margin:10px 0}.gs p{margin:0 0 6px;font-size:16.5px;line-height:1.6}
.ans{margin-top:12px;padding:12px;border-radius:12px;background:#3a3214;border:1px solid var(--gold);font-size:16.5px;line-height:1.6}
.tools{display:flex;gap:6px;margin:0 0 8px}.tools button{padding:7px 12px;border-radius:10px;border:1px solid var(--line);background:#262c48;color:#fff;font-size:14px}.tools button.on{background:#6a5a1a;border-color:var(--gold)}
canvas.ink{position:absolute;left:0;top:0;pointer-events:none;z-index:5}
#ctl{position:fixed;z-index:12;left:12px;bottom:14px;display:flex;flex-wrap:wrap;gap:6px;max-width:calc(54vw - 30px)}
#ctl button,#ctl label{padding:9px 12px;border-radius:12px;border:1px solid #ffffff33;background:#1d2238e8;color:#fff;font-size:14.5px}#ctl button.on{background:#2a6a58;border-color:var(--acc)}
#ctl label{display:flex;align-items:center;gap:8px}#ctl input{width:120px}
#gph{position:fixed;z-index:12;left:12px;top:58px;width:360px;height:220px;background:#0e1124cc;border:1px solid #ffffff22;border-radius:12px}
#menu{position:fixed;inset:0;z-index:30;display:flex;justify-content:flex-end;align-items:flex-start;padding:14px;overflow:auto}
#menu .mc{width:min(520px,100%);background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px}
#menu h1{margin:0 0 12px;font:30px Jua;color:var(--acc)}#menu h1 small{display:block;font:13px 'Noto Sans KR';opacity:.75;color:#fff}#menu h3{font:18px Jua;margin:18px 0 8px}#menu h3 small{font:12px 'Noto Sans KR';opacity:.6}
#menu button{padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:#262c48;color:#fff;font-size:15px}#menu .big{display:block;width:100%;font:19px Jua;margin-bottom:8px}#menu .pri{background:linear-gradient(#5affd0,#2ac8a0);color:#08241c;border:0}
#menu .row{display:flex;gap:6px;margin-top:6px}#menu select{flex:1;min-width:0;padding:10px;border-radius:12px;background:#262c48;color:#fff;border:1px solid var(--line);font-size:14px}
#menu .grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}.tip{font-size:12.5px;opacity:.6;line-height:1.6}
body.port #card{left:8px;right:8px;width:auto;top:auto;height:58vh;bottom:8px}body.port #ctl{bottom:calc(58vh + 18px);max-width:calc(100vw - 24px)}body.port #gph{width:280px;height:170px}body.port .fig img{max-height:22vh}
#top em{margin-left:auto;font:15px Jua;font-style:normal;color:var(--gold);white-space:nowrap}#top em b{color:#ff9a4a}
#mis{position:fixed;z-index:13;left:12px;top:288px;max-width:360px;padding:8px 12px;border-radius:12px;background:#1d2238ee;border:1.5px solid var(--gold);font-size:14.5px;line-height:1.45}#mis b{color:var(--gold)}#mis span{opacity:.75;font-size:12.5px}#mis.done{border-color:var(--acc);opacity:.85}#mis.pulse{animation:pl .6s 3}
@keyframes pl{50%{transform:scale(1.06);background:#2a6a58}}
body.port #mis{top:236px;max-width:calc(100vw - 24px)}#gph[hidden]~#mis{top:58px}
.pop{position:fixed;z-index:60;transform:translate(-50%,0);font:22px Jua;color:var(--gold);text-shadow:0 2px 6px #000;pointer-events:none;animation:up .95s ease-out forwards}
@keyframes up{to{transform:translate(-50%,-70px);opacity:0}}
.toast{position:fixed;z-index:61;left:50%;top:70px;transform:translateX(-50%);padding:10px 18px;border-radius:14px;background:#2a2350f0;border:1.5px solid var(--gold);font-size:17px;pointer-events:none;animation:tin 1.9s forwards}
@keyframes tin{0%{opacity:0;transform:translate(-50%,-10px)}12%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
i.cf{position:fixed;z-index:59;top:-12px;width:9px;height:14px;border-radius:2px;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}
#card.shake{animation:sh .35s}@keyframes sh{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.bar{height:8px;border-radius:4px;background:#ffffff1a;margin-bottom:8px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--gold));transition:width .3s}
.bl{font-size:19px;line-height:1.8}.slot{display:inline-block;min-width:70px;padding:0 10px;border-radius:8px;border:2px dashed var(--gold);text-align:center;color:var(--gold)}.slot.ok{border-style:solid;border-color:var(--acc);background:#1f5a48;color:#fff}.slot.no{border-style:solid;border-color:var(--bad);background:#5a1f2a;color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.chips button{padding:11px 16px;border-radius:999px;border:1.5px solid #5a6aa8;background:#262c48;color:#fff;font-size:17px}.chips button.ok{background:#1f5a48;border-color:var(--acc)}.chips button.no{background:#5a1f2a;border-color:var(--bad);animation:sh .3s}
p.big{font:30px Jua;color:var(--gold);margin:16px 0 4px}
#menu .grid button small{display:block;font-size:11.5px;opacity:.7}
</style></head><body>
<canvas id="stage"></canvas><canvas id="gph" width="360" height="220" hidden></canvas><div id="ctl" hidden></div>
<div id="top" hidden><button>☰ 메뉴</button><span></span><em id="xp"></em></div><div id="mis" hidden></div>
<div id="card" hidden><div class="hd"></div><div class="bd"></div><div class="ft"></div></div>
<div id="menu" hidden></div>
<script src="js/zoomfig.js?v=402611251"></script>
<script src="js/chem/data.js?v=2"></script>
<script src="js/chem/data2.js?v=1"></script>
<script src="js/chem/data3.js?v=1"></script>
<script type="importmap">{"imports":{"three":"./js/vendor/three.module.min.js"}}</script>
<script type="module" src="js/chem/main.js?v=2"></script>
</body></html>
