<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>1시간 자습 프린트</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Klee+One:wght@400;600&family=Gowun+Dodum&family=Noto+Sans+KR:wght@500;700&family=Noto+Sans+JP:wght@500;700&display=swap">
<style>
:root{--ink:#1d1b22;--paper:#fffdf6;--line:#cfc8b8;--red:#d12b4a;--blue:#2f5fbf;--hl:#fff0a0;--hand:'Gaegu','Klee One',sans-serif;--read:'Gowun Dodum','Noto Sans KR','Noto Sans JP',sans-serif;--jp:'Klee One','Noto Sans JP',serif}
*{box-sizing:border-box}
html,body{margin:0;background:#e9e4d8;color:var(--ink);font:14px/1.5 var(--read)}
#app{max-width:820px;margin:0 auto;padding:16px}
.pg,.top{background:var(--paper);border:1.5px solid var(--ink);border-radius:3px;padding:18px 22px;margin:0 0 16px;box-shadow:3px 4px 0 rgba(0,0,0,.18)}
h1{font:700 26px var(--hand);margin:0 0 4px}h2{font:700 24px var(--hand);margin:0 0 10px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}h2 em{font-style:normal;color:var(--red)}
h2 small,h3 small{font:13px var(--read);opacity:.7}h3{font:700 19px var(--hand);margin:16px 0 6px;border-bottom:2px solid var(--hl)}
ruby{font-family:var(--jp);font-weight:600}rt{font:500 10px 'Noto Sans JP';color:#8a6400}
.top{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:flex-start}.top p{margin:0}.ln{display:inline-block;width:110px;border-bottom:1px solid var(--ink);margin-right:14px}
.plan{list-style:none;margin:0;padding:0;font-size:13.5px}.plan li{display:flex;gap:6px;align-items:center;margin:2px 0}.bx{width:13px;height:13px;border:1.5px solid var(--ink);flex:none}
.np{font:700 15px var(--hand);background:#ffd23f;border:1.5px solid var(--ink);border-radius:3px;padding:3px 12px;cursor:pointer;box-shadow:2px 2px 0 rgba(0,0,0,.3)}
.t{padding:0 4px;border-radius:2px;font-weight:700}.t.h{color:var(--red)}.t.m{color:var(--blue)}.t.e{color:var(--ink)}
.cal{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mo{border:1.5px solid var(--ink);border-radius:2px;padding:6px 8px;background:repeating-linear-gradient(#0000 0 21px,#eee8da 21px 22px)}
.mh{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1.5px solid var(--ink);margin-bottom:4px}.mh b{font:700 20px var(--hand)}.mh small{font-size:11px;opacity:.6}
.ev{display:flex;gap:6px;margin:3px 0;line-height:1.3}.ev .d{flex:none;width:52px;font-size:11.5px;font-weight:700;padding-top:9px}.ev .w{min-width:0}.ev .w small{display:block;font-size:11px;opacity:.75}
.ev.h .d,.ev.h ruby{color:var(--red)}.ev.m .d,.ev.m ruby{color:var(--blue)}
.tip{margin:10px 0 0;font-size:12.5px;background:#f6f1e3;border-left:4px solid var(--hl);padding:6px 10px}
table{width:100%;border-collapse:collapse}th,td{border:1px solid var(--line);padding:4px 6px;text-align:left;vertical-align:middle}th{background:#f3eedf;font-weight:700;font-size:12.5px}
.kw td.jw{white-space:nowrap;font-size:16px}.kw td.jw small{display:block;font-size:11px;color:#8a6400}
.hz{display:inline-flex;align-items:baseline;gap:2px;margin:1px 6px 1px 0;padding:0 5px;border:1px solid var(--line);border-radius:2px;background:#fff}.hz b{font:600 17px var(--jp)}.hz i{font-style:normal;font-weight:700;color:var(--blue)}
.sp{font-size:11px;color:var(--red);font-weight:700;border:1px solid var(--red);border-radius:2px;padding:0 4px;margin-left:2px}
.wr{width:150px}td.wr{white-space:nowrap}td.wr span{display:inline-block;width:68px;height:26px;border-bottom:1px dashed #999;margin-right:6px}
.grp{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}.g{display:flex;gap:8px;border:1px solid var(--line);padding:5px 8px;background:#fff}.g span{display:inline-block;margin:0 10px 2px 0}.g small{font-size:11px;opacity:.7}
.gk{flex:none;text-align:center;width:40px;border-right:1px dashed var(--line)}.gk b{display:block;font:600 24px var(--jp)}.gk i{font-style:normal;font-weight:700;color:var(--blue)}
.cmp td:nth-child(2){color:var(--blue);font-weight:700}
.qs{margin:0;padding-left:26px}.qs li{margin:0 0 6px;padding-bottom:4px}.qs .ans{display:block;height:22px;border-bottom:1px dashed #999;margin-top:2px}
.score{margin:12px 0 0;font:700 18px var(--hand)}.score span{display:inline-block;width:40px;border-bottom:1.5px solid var(--ink)}
.ks{columns:2;font-size:13px;margin:0;padding-left:26px}.ks li{break-inside:avoid;margin-bottom:3px}
@media (max-width:640px){.cal{grid-template-columns:1fr 1fr}.grp{grid-template-columns:1fr}.wr,td.wr{display:none}.pg,.top{padding:12px}}
@media print{@page{size:A4;margin:12mm}html,body{background:#fff}#app{max-width:none;padding:0}.pg,.top{box-shadow:none;border:none;padding:0;margin:0 0 6mm}.np{display:none}
 .pg{break-before:page}.top+.pg{break-before:auto}.mo,.g,tr,.qs li{break-inside:avoid}.key{break-before:page}
 body{font-size:12px}.cal{grid-template-columns:repeat(4,1fr);gap:5px}.mo{padding:4px 6px}.ev{margin:1px 0}.ev .d{width:44px;font-size:10px;padding-top:7px}.ev .w small{font-size:9.5px}.mh b{font-size:17px}rt{font-size:8.5px}
 th,td{padding:2px 5px}.kw td.jw{font-size:14px}.hz b{font-size:14px}.hz{margin:0 4px 0 0}td.wr span{height:20px;width:60px}h3{margin:8px 0 4px}.qs li{margin:0 0 3px}.qs .ans{height:18px}}
</style></head><body>
<div id="app"></div>
<script src="js/jp/words.js?v=1"></script><script src="js/jp/yomi.js?v=3"></script><script src="js/jp/ja.js?v=3"></script><script src="js/jp/hanja.js?v=1"></script><script src="js/jp/print.js?v=3"></script>
</body></html>
