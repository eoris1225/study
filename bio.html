<body>
<div id="game"></div>
<div id="hud" hidden>
  <div id="mt"></div>
  <div id="obj" hidden></div>
  <div id="inv"><div data-k="ATP" style="--c:#ffd23f"><i>ATP</i><b>0</b></div><div data-k="NADH" style="--c:#4aa8ff"><i>NADH</i><b>0</b></div><div data-k="FADH2" style="--c:#47e38a"><i>FADH<sub>2</sub></i><b>0</b></div><div data-k="NADPH" style="--c:#7a8aff" hidden><i>NADPH</i><b>0</b></div><div data-k="NAD" style="--c:#8fb8ff"><i>NAD<sup>+</sup></i><b>0</b></div></div>
  <div id="board" hidden></div>
  <div id="guide" hidden></div>
  <div id="gauges" hidden></div>
  <button id="bMenu">메뉴</button>
  <div id="joy"><i></i></div>
  <div id="btns"><button id="bUp">▲</button><button id="bDn">▼</button><button id="bDash">대시</button><button id="bAct">행동</button></div>
</div>
<div id="marker" hidden><i>➤</i><b></b></div>
<div id="toasts"></div>
<div id="banner"></div>
<div id="flash"></div>
<div id="talk" hidden><div class="face m"><span></span><span></span></div><div><div class="who"></div><div class="txt"></div><small>탭해서 계속 ▸</small></div></div>
<div id="pick3" hidden></div>
<div id="lesson" hidden></div>
<div id="quiz" hidden></div>
<div id="cards" hidden></div>
<div id="notes" hidden></div>

<script type="module">
