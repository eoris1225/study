<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>화학 자습 프린트</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;700&display=swap">
<style>
:root{--ink:#1d1b22;--paper:#fffdf6;--line:#cfc8b8;--red:#c8264a;--blue:#2a5bbf;--hl:#fff0a0}
*{box-sizing:border-box}
html,body{margin:0;background:#e9e4d8;color:var(--ink);font:13.5px/1.55 'Noto Sans KR',sans-serif}
#app{max-width:840px;margin:0 auto;padding:16px}
.pg,.top{background:var(--paper);border:1.5px solid var(--ink);border-radius:3px;padding:18px 22px;margin:0 0 16px;box-shadow:3px 4px 0 rgba(0,0,0,.18)}
h1{font:26px Jua;margin:0 0 4px}h2{font:22px Jua;margin:0 0 10px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}h2 em{font-style:normal;color:var(--red)}
h2 small{font:12.5px 'Noto Sans KR';opacity:.7}h3{font:18px Jua;margin:14px 0 6px;border-bottom:2px solid var(--hl)}h4{font:17px Jua;margin:0 0 4px;color:var(--blue)}h5{font:15px Jua;margin:0 0 2px;color:var(--blue)}
b{color:#8a1d3a}sub,sup{font-size:.7em}
.top{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:flex-start}.top p{margin:0}
.ln{display:inline-block;min-width:110px;border-bottom:1px solid var(--ink);margin:0 4px}.ln.w{min-width:220px}
.plan{list-style:none;margin:0;padding:0;font-size:13px}.plan li{display:flex;gap:6px;align-items:center;margin:2px 0}.bx2{width:13px;height:13px;border:1.5px solid var(--ink);flex:none}
.btns{display:flex;gap:8px;flex-wrap:wrap}.np{font:15px Jua;background:#5affd0;border:1.5px solid var(--ink);border-radius:3px;padding:4px 12px;cursor:pointer;box-shadow:2px 2px 0 rgba(0,0,0,.3)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.bx{border:1.5px solid var(--ink);border-radius:3px;padding:8px 10px;background:#fff}.bx ul{margin:0;padding-left:18px}.bx li{margin:2px 0;font-size:12.8px}
table{border-collapse:collapse;width:100%}th,td{border:1px solid var(--line);padding:2px 6px;text-align:center;font-size:12.5px}th{background:#f3eedf}.mini{margin-top:6px}
.cards{columns:2;column-gap:10px}.cd{break-inside:avoid;border:1px solid var(--line);border-radius:3px;padding:6px 9px;margin:0 0 8px;background:#fff}.cd p{margin:2px 0;font-size:12.3px}.cd .w{color:#555}.cd .tr{color:var(--red)}.cd .tr b{color:var(--red)}
.bl{margin:0;padding-left:26px;columns:2;column-gap:20px}.bl li{break-inside:avoid;margin:0 0 7px;font-size:12.8px}.bl .ln{min-width:90px}
.pqs{display:grid;grid-template-columns:1fr 1fr;gap:8px}.pq{break-inside:avoid;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:3px;margin:0 0 10px;padding:6px 8px;background:#fff}.ph{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;margin-bottom:4px}.ph b{font:18px Jua;color:var(--red)}.ph span{font-size:12px;opacity:.7}.ph i{font-style:normal;font-size:12px;width:100%}.ph i .ln.w{min-width:150px}
.pq img{display:block;width:100%;max-height:300px;object-fit:contain;flex:1}.sm{margin:4px 0 0;font-size:12px;opacity:.7}.ans-ln{margin-top:6px;font-size:13px}.ans-ln .ln{min-width:240px}
.kb{columns:3;font-size:12.5px;margin:0;padding-left:26px}.ka{border-bottom:1px dashed var(--line);padding:5px 0}.ka p{margin:2px 0;font-size:12.5px}.ka .an{color:var(--blue)}.ka .wy{color:#444}
.score{margin:12px 0 0;font:16px Jua}.score span{display:inline-block;width:36px;border-bottom:1.5px solid var(--ink)}
@media (max-width:640px){.pqs{grid-template-columns:1fr}.two,.cards,.bl{grid-template-columns:1fr;columns:1}.kb{columns:2}.pg,.top{padding:12px}#app{padding:8px}.ln.w{min-width:140px}}
@media print{@page{size:A4;margin:11mm}html,body{background:#fff}#app{max-width:none;padding:0}.pg,.top{box-shadow:none;border:none;padding:0;margin:0 0 5mm}.btns{display:none}
 .pg{break-before:page}.top+.pg{break-before:auto}.bx,.cd,.pq,.ka{break-inside:avoid}.pq img{max-height:250px}.pqs{gap:5mm}}
</style></head><body>
<div id="app"></div>
<script src="js/chem/data.js?v=2"></script><script src="js/chem/data2.js?v=1"></script><script src="js/chem/data3.js?v=1"></script><script src="js/chem/solve.js?v=1"></script><script src="js/chem/data4.js?v=1"></script><script src="js/chem/print.js?v=2"></script>
</body></html>
